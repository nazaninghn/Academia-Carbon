services:
  - type: web
    name: academia-carbon
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn carbon_tracker.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: academia-carbon-db
          property: connectionString

databases:
  - name: academia-carbon-db
    plan: free